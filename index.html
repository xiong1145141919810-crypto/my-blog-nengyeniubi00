<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>能爷的博客</title>
    <script>
        (function(){
            var t=localStorage.getItem('blog_theme');
            if(t==='light') document.documentElement.setAttribute('data-theme','light');
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ========== 主题颜色变量 ========== */
        :root {
            --bg-overlay: rgba(0, 0, 0, 0.35);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-bg-hover: rgba(255, 255, 255, 0.18);
            --card-border: rgba(255, 255, 255, 0.15);
            --card-border-hover: rgba(255, 255, 255, 0.3);
            --card-shadow: rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(30, 30, 50, 0.95);
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-bg-focus: rgba(255, 255, 255, 0.15);
            --input-border: rgba(255, 255, 255, 0.25);
            --input-border-focus: rgba(255, 255, 255, 0.7);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --text-muted: rgba(255, 255, 255, 0.5);
            --text-dim: rgba(255, 255, 255, 0.4);
            --border-standard: rgba(255, 255, 255, 0.2);
            --border-strong: rgba(255, 255, 255, 0.3);
            --accent-coral: #ff6b6b;
            --accent-orange: #ff8e53;
            --accent-gold: #ffd93d;
            --accent-green: #2ed573;
            --accent-red: #ff4757;
            --accent-blue: #4d96ff;
            --accent-purple: #a855f7;
            --accent-gold-dark: #ffd700;
            --gradient-primary: linear-gradient(135deg, #ff6b6b, #ff8e53);
            --gradient-tab: linear-gradient(90deg, #ff6b6b, #ffd93d);
            --gradient-section: linear-gradient(180deg, #ff6b6b, #ffd93d);
            --gradient-dice: linear-gradient(135deg, #4d96ff, #a855f7);
            --gradient-game: linear-gradient(135deg, #ffd93d, #ff8e53);
            --cursor-dot: #fff;
            --cursor-ring: rgba(255, 255, 255, 0.5);
            --cursor-ring-hover: rgba(255, 217, 61, 0.7);
            --particle-color: rgba(255, 255, 255, 0.6);
            --trail-color: rgba(255, 255, 255, 0.4);
            --navbar-bg: rgba(255, 255, 255, 0.1);
            --navbar-border: rgba(255, 255, 255, 0.15);
            --btn-cancel-bg: rgba(255, 255, 255, 0.1);
            --btn-cancel-hover: rgba(255, 255, 255, 0.2);
            --btn-delete-hover: rgba(255, 71, 87, 0.5);
            --btn-logout-hover: rgba(255, 71, 87, 0.6);
            --tag-bg: rgba(255, 255, 255, 0.1);
            --profile-popup-bg: rgba(20, 20, 40, 0.95);
            --dice-face-bg: #fff;
            --dice-face-text: #333;
            --lightbox-bg: rgba(0, 0, 0, 0.9);
            --title-text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --logo-text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            --btn-text: #fff;
            --toast-text: #fff;
            --accent-coral-rgb: 255, 107, 107;
            --accent-green-rgb: 46, 213, 115;
            --accent-gold-rgb: 255, 217, 61;
            --accent-blue-rgb: 77, 150, 255;
        }

        [data-theme="light"] {
            --bg-overlay: rgba(255, 255, 255, 0.55);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-bg-hover: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.1);
            --card-border-hover: rgba(0, 0, 0, 0.2);
            --card-shadow: rgba(0, 0, 0, 0.08);
            --modal-bg: rgba(255, 255, 255, 0.95);
            --overlay-bg: rgba(0, 0, 0, 0.35);
            --input-bg: rgba(0, 0, 0, 0.04);
            --input-bg-focus: rgba(0, 0, 0, 0.07);
            --input-border: rgba(0, 0, 0, 0.15);
            --input-border-focus: rgba(0, 0, 0, 0.4);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.5);
            --text-dim: rgba(26, 26, 46, 0.35);
            --border-standard: rgba(0, 0, 0, 0.12);
            --border-strong: rgba(0, 0, 0, 0.2);
            --accent-gold-dark: #b8860b;
            --cursor-dot: #1a1a2e;
            --cursor-ring: rgba(26, 26, 46, 0.4);
            --particle-color: rgba(26, 26, 46, 0.25);
            --trail-color: rgba(26, 26, 46, 0.25);
            --navbar-bg: rgba(255, 255, 255, 0.75);
            --navbar-border: rgba(0, 0, 0, 0.08);
            --btn-cancel-bg: rgba(0, 0, 0, 0.05);
            --btn-cancel-hover: rgba(0, 0, 0, 0.1);
            --btn-delete-hover: rgba(255, 71, 87, 0.15);
            --btn-logout-hover: rgba(255, 71, 87, 0.15);
            --tag-bg: rgba(0, 0, 0, 0.06);
            --profile-popup-bg: rgba(255, 255, 255, 0.95);
            --title-text-shadow: none;
            --logo-text-shadow: none;
            --lightbox-bg: rgba(0, 0, 0, 0.92);
        }

        /* 全局过渡 */
        *, *::before, *::after {
            transition: background-color 0.3s ease, background 0.3s ease, border-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease, text-shadow 0.3s ease;
        }
        .cursor-dot, .cursor-ring, .cursor-trail, .cursor-click-burst, .particle, .firework-particle {
            transition: none !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 80px;
            background: url('1.png') center/cover no-repeat;
            font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 0;
        }

        /* 浮动粒子 */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--particle-color);
            border-radius: 50%;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ========== 鼠标动画 ========== */
        .cursor-dot {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            width: 8px;
            height: 8px;
            background: var(--cursor-dot);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        .cursor-dot.hover {
            width: 16px;
            height: 16px;
            background: var(--accent-gold);
            mix-blend-mode: normal;
        }

        .cursor-ring {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 36px;
            height: 36px;
            border: 2px solid var(--cursor-ring);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border-color 0.3s;
        }

        .cursor-ring.hover {
            width: 50px;
            height: 50px;
            border-color: var(--cursor-ring-hover);
        }

        .cursor-trail {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--trail-color);
            transform: translate(-50%, -50%);
            animation: trailFade 0.6s ease-out forwards;
        }

        @keyframes trailFade {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
        }

        .cursor-click-burst {
            position: fixed;
            pointer-events: none;
            z-index: 10001;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-gold);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: clickBurst 0.6s ease-out forwards;
        }

        @keyframes clickBurst {
            0% { width: 0; height: 0; opacity: 1; border-width: 4px; }
            100% { width: 80px; height: 80px; opacity: 0; border-width: 1px; }
        }

        /* ========== 主题切换按钮 ========== */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10001;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-standard);
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            padding: 0;
            color: inherit;
        }

        .theme-toggle:hover {
            background: var(--card-bg-hover);
            border-color: var(--card-border-hover);
            transform: scale(1.1);
        }

        .theme-icon {
            display: inline-block;
            transition: transform 0.5s ease;
        }

        /* 标题区域 */
        .title-section {
            position: relative;
            z-index: 2;
            animation: slideInLeft 1s ease-out;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        h1 {
            font-size: 6rem;
            color: var(--text-primary);
            text-shadow: var(--title-text-shadow);
            letter-spacing: 0.1em;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 40px rgba(255, 255, 255, 0.1);
            }
            50% {
                text-shadow: 0 4px 30px rgba(0, 0, 0, 0.4), 0 0 80px rgba(255, 255, 255, 0.3);
            }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            text-align: center;
            margin-top: 12px;
            letter-spacing: 0.2em;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 功能介绍 */
        .features {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .feature-item {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px 20px;
            text-align: center;
            transition: all 0.3s;
            flex: 1;
            min-width: 100px;
        }

        .feature-item:hover {
            background: var(--card-bg-hover);
            transform: translateY(-3px);
            border-color: var(--card-border-hover);
        }

        .feature-item .icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .feature-item .label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            letter-spacing: 0.04em;
        }

        /* 表单卡片 */
        .form-card {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 44px 40px;
            border: 1px solid var(--border-standard);
            min-width: 360px;
            animation: slideInRight 1s ease-out;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .form-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 60px var(--card-shadow);
        }

        @keyframes slideInRight {
            from { transform: translateX(80px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 切换标签 */
        .tabs {
            display: flex;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-standard);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            letter-spacing: 0.05em;
        }

        .tab.active {
            color: var(--text-primary);
            font-weight: bold;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 2px;
            background: var(--gradient-tab);
            border-radius: 2px;
        }

        .tab:hover {
            color: var(--text-secondary);
        }

        /* 表单 */
        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
            animation: fadeInUp 0.4s ease-out;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
        }

        .form-card label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }

        .form-card input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-card input::placeholder {
            color: var(--text-dim);
        }

        .form-card input:focus {
            border-color: var(--input-border-focus);
            background: var(--input-bg-focus);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }

        .form-card button {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: none;
            border-radius: 10px;
            background: var(--gradient-primary);
            color: var(--btn-text);
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.08em;
            position: relative;
            overflow: hidden;
        }

        .form-card button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .form-card button:hover::before {
            width: 400px;
            height: 400px;
        }

        .form-card button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(var(--accent-coral-rgb), 0.4);
        }

        .form-card button:active {
            transform: translateY(0) scale(0.97);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                gap: 40px;
            }
            h1 { font-size: 3rem; }
            .form-card {
                min-width: auto;
                width: 100%;
                max-width: 360px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 鼠标光标 -->
    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-ring" id="cursor-ring"></div>

    <!-- 主题切换按钮 -->
    <button class="theme-toggle" id="theme-toggle" title="切换日间/夜间模式" aria-label="切换日间/夜间模式">
        <span class="theme-icon">🌙</span>
    </button>

    <div class="particles" id="particles"></div>

    <div class="title-section">
        <h1>能爷的博客</h1>
        <p class="subtitle">— 记录生活，分享热爱 —</p>
        <div class="features">
            <div class="feature-item">
                <div class="icon">📝</div>
                <div class="label">写文章</div>
            </div>
            <div class="feature-item">
                <div class="icon">🖼</div>
                <div class="label">发图片</div>
            </div>
            <div class="feature-item">
                <div class="icon">💣</div>
                <div class="label">数字炸弹</div>
            </div>
        </div>
    </div>

    <div class="form-card">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">登 录</div>
            <div class="tab" onclick="switchTab('register')">注 册</div>
        </div>

        <!-- 登录表单 -->
        <div class="form-panel active" id="login-panel">
            <div class="input-group">
                <label for="login-username">👤 账户名</label>
                <input type="text" id="login-username" placeholder="请输入账户名">
            </div>
            <div class="input-group">
                <label for="login-password">🔒 密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
            </div>
            <button onclick="login()">登 录</button>
        </div>

        <!-- 注册表单 -->
        <div class="form-panel" id="register-panel">
            <div class="input-group">
                <label for="reg-username">👤 账户名</label>
                <input type="text" id="reg-username" placeholder="请输入账户名">
            </div>
            <div class="input-group">
                <label for="reg-password">🔒 密码</label>
                <input type="password" id="reg-password" placeholder="请输入密码">
            </div>
            <div class="input-group">
                <label for="reg-age">🎂 年龄（选填）</label>
                <input type="number" id="reg-age" placeholder="请输入年龄" min="1" max="150">
            </div>
            <button onclick="register()">注 册</button>
        </div>
    </div>

    <script>
        // ========== 自动登录检测 ==========
        if (localStorage.getItem('blog_currentUser')) {
            window.location.href = 'blog_main.html';
        }

        // ========== 日间/夜间模式切换 ==========
        (function initTheme() {
            const toggle = document.getElementById('theme-toggle');
            const icon = toggle.querySelector('.theme-icon');

            function updateIcon() {
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                icon.textContent = isLight ? '☀️' : '🌙';
                toggle.setAttribute('title', isLight ? '切换夜间模式' : '切换日间模式');
                toggle.setAttribute('aria-label', isLight ? '切换夜间模式' : '切换日间模式');
                icon.style.transform = 'rotate(0deg)';
                requestAnimationFrame(() => { icon.style.transform = 'rotate(360deg)'; });
            }

            updateIcon();

            toggle.addEventListener('click', function() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? '' : 'light';
                if (next) {
                    document.documentElement.setAttribute('data-theme', next);
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                localStorage.setItem('blog_theme', next || 'dark');
                updateIcon();
            });
        })();

        // ========== 粒子动画 ==========
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDuration = (Math.random() * 6 + 4) + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.width = (Math.random() * 4 + 3) + 'px';
            particle.style.height = particle.style.width;
            particlesContainer.appendChild(particle);
        }

        // ========== 鼠标光标动画 ==========
        const cursorDot = document.getElementById('cursor-dot');
        const cursorRing = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0;
        let ringX = 0, ringY = 0;

        document.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursorDot.style.left = mouseX + 'px';
            cursorDot.style.top = mouseY + 'px';

            if (Math.random() < 0.5) {
                const trail = document.createElement('div');
                trail.className = 'cursor-trail';
                trail.style.left = mouseX + 'px';
                trail.style.top = mouseY + 'px';
                trail.style.width = (Math.random() * 5 + 2) + 'px';
                trail.style.height = trail.style.width;
                const hue = (Date.now() / 10 + Math.random() * 60) % 360;
                trail.style.background = `hsl(${hue}, 70%, 60%)`;
                document.body.appendChild(trail);
                setTimeout(() => trail.remove(), 600);
            }
        });

        function animateRing() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            cursorRing.style.left = ringX + 'px';
            cursorRing.style.top = ringY + 'px';
            requestAnimationFrame(animateRing);
        }
        animateRing();

        document.addEventListener('click', function(e) {
            const burst = document.createElement('div');
            burst.className = 'cursor-click-burst';
            burst.style.left = e.clientX + 'px';
            burst.style.top = e.clientY + 'px';
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 600);

            for (let i = 0; i < 12; i++) {
                const spark = document.createElement('div');
                spark.className = 'cursor-trail';
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.width = '4px';
                spark.style.height = '4px';
                spark.style.background = '#ffd93d';
                spark.style.animation = 'none';
                spark.style.transition = 'all 0.5s ease-out';
                document.body.appendChild(spark);

                const angle = (Math.PI * 2 * i) / 12;
                const dist = 20 + Math.random() * 30;
                requestAnimationFrame(() => {
                    spark.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`;
                    spark.style.opacity = '0';
                });
                setTimeout(() => spark.remove(), 500);
            }
        });

        document.addEventListener('mouseover', function(e) {
            const target = e.target.closest('button, a, input, .tab, .theme-toggle');
            if (target) {
                cursorDot.classList.add('hover');
                cursorRing.classList.add('hover');
            }
        });

        document.addEventListener('mouseout', function(e) {
            const target = e.target.closest('button, a, input, .tab, .theme-toggle');
            if (target) {
                cursorDot.classList.remove('hover');
                cursorRing.classList.remove('hover');
            }
        });

        // ========== 标签切换 ==========
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));

            if (tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-panel').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('register-panel').classList.add('active');
            }
        }

        // ========== 初始化用户数据 ==========
        function getUsers() {
            const users = localStorage.getItem('blog_users');
            return users ? JSON.parse(users) : {};
        }

        function saveUsers(users) {
            localStorage.setItem('blog_users', JSON.stringify(users));
        }

        // ========== 注册 ==========
        function register() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!username || !password) {
                showToast('请填写账户名和密码', 'error');
                return;
            }

            const users = getUsers();
            if (users[username]) {
                showToast('该账户名已被注册', 'error');
                return;
            }

            users[username] = password;
            saveUsers(users);

            // 创建用户资料（含年龄）
            const ageVal = document.getElementById('reg-age').value.trim();
            const parsedAge = ageVal ? parseInt(ageVal) : null;
            if (parsedAge !== null && (isNaN(parsedAge) || parsedAge < 1 || parsedAge > 150)) {
                showToast('请输入有效年龄（1-150 岁）', 'error');
                return;
            }
            const profile = {
                avatar: '😎',
                nickname: username,
                bio: '',
                age: parsedAge
            };
            localStorage.setItem('blog_profile_' + username, JSON.stringify(profile));

            showToast('🎉 注册成功！欢迎 ' + username + '！', 'success');

            // 注册成功后自动登录跳转
            setTimeout(() => {
                localStorage.setItem('blog_currentUser', username);
                window.location.href = 'blog_main.html';
            }, 800);
        }

        // ========== 登录 ==========
        function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                showToast('请填写账户名和密码', 'error');
                return;
            }

            const users = getUsers();
            if (!users[username]) {
                showToast('账户不存在，请先注册', 'error');
                return;
            }

            if (users[username] !== password) {
                showToast('密码错误', 'error');
                return;
            }

            localStorage.setItem('blog_currentUser', username);
            showToast('✅ 登录成功！欢迎回来，' + username + '！', 'success');
            setTimeout(() => {
                window.location.href = 'blog_main.html';
            }, 800);
        }

        // ========== Toast 提示 ==========
        function showToast(msg, type) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed;
                top: 30px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 9999;
                padding: 14px 28px;
                border-radius: 10px;
                color: var(--toast-text);
                font-size: 1rem;
                font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
                letter-spacing: 0.04em;
                background: ${type === 'error' ? 'rgba(255,71,87,0.9)' : 'rgba(46,213,115,0.9)'};
                backdrop-filter: blur(10px);
                animation: toastIn 0.3s ease-out;
                pointer-events: none;
            `;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastOut 0.3s ease-out forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Toast 动画
        const toastStyle = document.createElement('style');
        toastStyle.textContent = `
            @keyframes toastIn {
                from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
                to { transform: translateX(-50%) translateY(0); opacity: 1; }
            }
            @keyframes toastOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(toastStyle);

        // ========== 回车键提交 ==========
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginPanel = document.getElementById('login-panel');
                if (loginPanel.classList.contains('active')) {
                    login();
                } else {
                    register();
                }
            }
        });
    </script>
</body>
</html>
